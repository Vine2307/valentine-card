<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Valentine Story ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to top, #0f2027, #203a43, #2c5364);
    color: white;
    text-align: center;
    overflow-x: hidden;
}

/* Cover Section */
.cover {
    height: 100vh;
    background: url('cover.JPG') center/cover no-repeat;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-attachment: fixed;
}

.cover h1 {
    font-size: 45px;
    background: rgba(0,0,0,0.5);
    padding: 20px;
    border-radius: 15px;
}

.enter-btn {
    margin-top: 20px;
    padding: 12px 25px;
    font-size: 18px;
    border-radius: 25px;
    border: none;
    cursor: pointer;
    background: pink;
}

/* Stars */
.stars {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: -1;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: 0.3; }
    to { opacity: 1; }
}

/* Floating hearts */
.heart {
    position: fixed;
    bottom: -20px;
    color: pink;
    font-size: 20px;
    animation: floatUp 8s linear infinite;
}

@keyframes floatUp {
    0% { transform: translateY(0); opacity:1;}
    100% { transform: translateY(-100vh); opacity:0;}
}

/* Flip Card */
.card-container {
    perspective: 1000px;
    margin: 50px auto;
}

.card {
    width: 300px;
    height: 200px;
    margin: auto;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 1s;
    cursor: pointer;
}

.card.flip { transform: rotateY(180deg); }

.card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.front { background: rgba(255,255,255,0.2); }
.back  { background: rgba(255,105,180,0.4); transform: rotateY(180deg); }

/* Photo Reel */
.reel-container {
    width: 90%;
    max-width: 400px;
    margin: 30px auto;
    overflow: hidden;
    border-radius: 15px;
}

.reel {
    display: flex;
    animation: slide 20s infinite;
}

.reel img {
    width: 100%;
    flex-shrink: 0;
    border-radius: 15px;
}

@keyframes slide {
    0% { transform: translateX(0); }
    20% { transform: translateX(0); }
    25% { transform: translateX(-100%); }
    45% { transform: translateX(-100%); }
    50% { transform: translateX(-200%); }
    70% { transform: translateX(-200%); }
    75% { transform: translateX(-300%); }
    95% { transform: translateX(-300%); }
    100% { transform: translateX(-400%); }
}

/* Proposal Button */
.proposal-btn {
    padding: 12px 25px;
    border-radius: 25px;
    border: none;
    background: hotpink;
    color: white;
    font-size: 18px;
    margin: 20px;
    cursor: pointer;
}

/* Valentine Message */
.vday-message {
    max-width: 600px;
    margin: 20px auto;
    padding: 20px;
    background: rgba(255,255,255,0.1);
    border-radius: 15px;
}

/* Mobile */
@media (max-width:480px){
    .cover h1 { font-size: 28px; }
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<!-- Cover Section -->
<div class="cover">
    <h1>Happy Valentine’s Day ❤️</h1>
    <button class="enter-btn" onclick="enterSite()">Enter Our Love Story 💖</button>
</div>

<!-- Flip Card -->
<div class="card-container">
    <div class="card" id="card" onclick="flipCard()">
        <div class="card-face front">Tap to Open 💌</div>
        <div class="card-face back">
            You are my moon, my stars, my forever ❤️
        </div>
    </div>
</div>

<!-- Photo Reel -->
<div class="reel-container">
    <div class="reel">
        <img src="photo1.JPG">
        <img src="photo2.jpg">
        <img src="photo3.jpg">
        <img src="photo4.jpg">
        <img src="photo5.jpg">
    </div>
</div>

<!-- Message -->
<div class="vday-message">
    Valentine’s Day is not just about gifts.  
    It’s about love, memories, and the beautiful journey we share.  
    Every moment with you feels magical. ❤️
</div>

<!-- Proposal -->
<button class="proposal-btn" onclick="proposal()">
    Will You Be Mine Forever? 💍
</button>

<!-- Music -->
<audio id="loveSong" loop>
    <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
// Enter scroll
function enterSite() {
    window.scrollTo({ top: window.innerHeight, behavior: 'smooth' });
}

// Flip card
function flipCard() {
    document.getElementById("card").classList.toggle("flip");
}

// Proposal
function proposal() {
    document.getElementById("loveSong").play();
    alert("I Love You Forever ❤️");
}

// Stars
const starContainer = document.getElementById("stars");
for (let i = 0; i < 120; i++) {
    let star = document.createElement("div");
    star.className = "star";
    star.style.top = Math.random() * 100 + "%";
    star.style.left = Math.random() * 100 + "%";
    star.style.animationDuration = (1 + Math.random() * 2) + "s";
    starContainer.appendChild(star);
}

// Floating hearts
setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 8000);
}, 800);
</script>

</body>
</html>
